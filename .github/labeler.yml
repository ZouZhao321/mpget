# PR 按改动路径打标签。键是标签名，值是匹配规则。
# 路径按仓库实际结构改。

kind/docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

kind/chore:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "scripts/**"
          - "package.json"
          - "pnpm-lock.yaml"
          - "pnpm-workspace.yaml"
          - "tsconfig.json"
          - "vitest.config.ts"
          - "eslint.config.mjs"
          - ".prettierrc"
          - ".prettierignore"
          - ".gitattributes"
          - ".gitignore"

# 所有 PR 先挂待评估标志，与 issue 侧一致
needs-triage:
  - changed-files:
      - any-glob-to-any-file: "**"
